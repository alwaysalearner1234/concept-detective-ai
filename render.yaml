services:
  - type: web
    name: concept-detective-api
    runtime: python
    buildCommand: cd Backend && pip install -r requirements.txt
    startCommand: cd Backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ALLOWED_ORIGINS
        value: https://concept-detective.netlify.app,https://concept-detective-ai.netlify.app
      - key: CORS_ORIGIN_REGEX
        value: '^https://[a-z0-9-]+--concept-detective\.netlify\.app$'
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-3-5-sonnet-20241022
